        type: integer
      business_outlook:
        type: string
      ceo_approval:
        type: boolean
      company_id:
        type: string
      compensation:
        description: rating out of 5
        type: integer
      con:
        type: string
      id:
        type: string
      pro:
        type: string
      recommend:
        type: boolean
      star_rating:
        description: overall rating out of 5
        type: integer
      work_life_balance:
        description: rating out of 5
