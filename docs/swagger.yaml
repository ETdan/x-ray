    type: object
  dto.CompanyRes:
    properties:
      album:
        items:
          type: string
        type: array
      created_at:
        type: string
      description:
        type: string
      headquarters:
        type: string
      id:
        type: string
      industry:
        type: string
      logo:
        type: string
      name:
        type: string
      size:
        type: string
      updated_at:
        type: string
      website:
        type: string
    type: object
  dto.CreateInterviewReq:
    properties:
      company_id:
        type: string
      description:
        type: string
      difficulty:
        $ref: '#/definitions/dto.Difficulty'
      experience:
        type: integer
      got_offer:
        type: boolean
      job_title:
        type: string
      user_id:
        type: string
    type: object
  dto.CreateReviewReq:
    properties:
      benefit:
        description: rating out of 5
        type: integer
      business_outlook:
        type: string
      ceo_approval:
        type: boolean
      company_id:
        type: string
      compensation:
        description: rating out of 5
        type: integer
      con:
        type: string
      pro:
        type: string
      recommend:
        type: boolean
      star_rating:
        description: overall rating out of 5
        type: integer
      user_id:
        type: string
      work_life_balance:
        description: rating out of 5
        type: integer
    type: object
  dto.CreateSalaryReq:
    properties:
      benefit:
        type: integer
      bonus:
        type: integer
      company_id:
        type: string
      experience:
        type: integer
      job_title:
        type: string
      position:
        type: string
      salary_avg:
        description: average net salary
        type: integer
      salary_max:
        description: maximum net salary
        type: integer
      salary_min:
        description: minimum net salary
        type: integer
      user_id:
        type: string
    type: object
  dto.Difficulty:
    enum:
    - 1
    - 2
    - 3
    - 4
    type: integer
    x-enum-varnames:
    - Easy
    - Medium
    - Hard
    - VeryHard
  dto.InterviewRes:
    properties:
      company_id:
        type: string
      description:
        type: string
